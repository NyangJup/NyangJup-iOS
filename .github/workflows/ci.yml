name: iOS CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  XCODE_PROJECT: ./NyangJup/NyangJup.xcodeproj
  APP_SCHEME: NyangJup
  PACKAGE_DIR: ./NyangJup/Packages/Package
  PACKAGE_SCHEME: NJPackage-Package

jobs:
  ios-build:
    name: ios-build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Create Config.xcconfig
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          MINIGAME_URL: ${{ secrets.MINIGAME_URL }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$MINIGAME_URL" ]; then
            echo "BASE_URL and MINIGAME_URL secrets are required."
            exit 1
          fi

          SAFE_BASE_URL="$(printf '%s' "$BASE_URL" | sed 's#//#$(NJ_SLASH)$(NJ_SLASH)#')"
          SAFE_MINIGAME_URL="$(printf '%s' "$MINIGAME_URL" | sed 's#//#$(NJ_SLASH)$(NJ_SLASH)#')"

          {
            printf '%s\n' 'NJ_SLASH = /'
            printf 'BASE_URL = %s\n' "$SAFE_BASE_URL"
            printf 'MINIGAME_URL = %s\n' "$SAFE_MINIGAME_URL"
            printf '%s\n' 'INFOPLIST_KEY_MiniGameURL = $(MINIGAME_URL)'
            printf '%s\n' 'INFOPLIST_KEY_API_BASE_URL = $(BASE_URL)'
          } > NyangJup/Config.xcconfig

      - name: Build
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-test:
    name: ios-test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Test
        working-directory: ${{ github.workspace }}/NyangJup/Packages/Package
        run: |
          for attempt in {1..3}; do
            DESTINATION_ID="$(
              xcrun simctl list devices available -j |
              jq -r '
                .devices
                | to_entries[]
                | select(.key | contains("iOS-26-2"))
                | .value[]
                | select(.name | startswith("iPhone"))
                | .udid
              ' |
              head -1
            )"

            if [ -n "$DESTINATION_ID" ]; then
              break
            fi

            echo "Waiting for the iOS 26.2 simulator ($attempt/3)"
            sleep 5
          done

          if [ -z "$DESTINATION_ID" ]; then
            xcrun simctl list devices available
            echo "No available iPhone simulator for iOS 26.2"
            exit 1
          fi

          xcrun simctl boot "$DESTINATION_ID" || true
          xcrun simctl bootstatus "$DESTINATION_ID" -b

          xcodebuild \
            -scheme "$PACKAGE_SCHEME" \
            -destination "id=$DESTINATION_ID" \
            -skipMacroValidation \
            test
