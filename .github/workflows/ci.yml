name: iOS CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  XCODE_PROJECT: ./NyangJup/NyangJup.xcodeproj
  APP_SCHEME: NyangJup
  PACKAGE_DIR: ./NyangJup/Packages/Package
  PACKAGE_SCHEME: NJPackage-Package

jobs:
  ios-build:
    name: ios-build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-test:
    name: ios-test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Test
        working-directory: ${{ github.workspace }}/NyangJup/Packages/Package
        run: |
          for attempt in {1..3}; do
            DESTINATION_ID="$(
              xcrun simctl list devices available -j |
              jq -r '
                .devices
                | to_entries[]
                | select(.key | contains("iOS-26-2"))
                | .value[]
                | select(.name | startswith("iPhone"))
                | .udid
              ' |
              head -1
            )"

            if [ -n "$DESTINATION_ID" ]; then
              break
            fi

            echo "Waiting for the iOS 26.2 simulator ($attempt/3)"
            sleep 5
          done

          if [ -z "$DESTINATION_ID" ]; then
            xcrun simctl list devices available
            echo "No available iPhone simulator for iOS 26.2"
            exit 1
          fi

          xcrun simctl boot "$DESTINATION_ID" || true
          xcrun simctl bootstatus "$DESTINATION_ID" -b

          xcodebuild \
            -scheme "$PACKAGE_SCHEME" \
            -destination "id=$DESTINATION_ID" \
            -skipMacroValidation \
            test
