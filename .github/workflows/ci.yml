name: iOS CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  XCODE_PROJECT: ./NyangJup/NyangJup.xcodeproj
  APP_SCHEME: NyangJup
  PACKAGE_DIR: ./NyangJup/Packages/Package
  PACKAGE_SCHEME: NJPackage-Package

jobs:
  ios-build:
    name: ios-build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-test:
    name: ios-test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test
        working-directory: ${{ github.workspace }}/NyangJup/Packages/Package
        run: |
          DESTINATION="$(xcodebuild -scheme "$PACKAGE_SCHEME" -showdestinations | awk '/platform:iOS Simulator/ && /OS:/ {print; exit}' | sed -E 's/.*id:([^,}]+).*/id=\1/')"

          if [ -z "$DESTINATION" ]; then
            echo "No iOS Simulator destination found for $PACKAGE_SCHEME"
            exit 1
          fi

          xcodebuild \
            -scheme "$PACKAGE_SCHEME" \
            -destination "$DESTINATION" \
            -skipMacroValidation \
            test
