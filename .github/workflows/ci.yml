name: iOS CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ios-build:
    name: ios-build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve project settings
        id: project
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)"
          project="$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)"

          if [[ -n "$workspace" ]]; then
            echo "container=-workspace $workspace" >> "$GITHUB_OUTPUT"
            scheme="$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')"
          elif [[ -n "$project" ]]; then
            echo "container=-project $project" >> "$GITHUB_OUTPUT"
            scheme="$(xcodebuild -list -project "$project" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')"
          else
            echo "Missing Xcode workspace or project"
            exit 1
          fi

          if [[ -z "$scheme" ]]; then
            echo "Missing shared Xcode scheme"
            exit 1
          fi

          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            ${{ steps.project.outputs.container }} \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-test:
    name: ios-test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve project settings
        id: project
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)"
          project="$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)"

          if [[ -n "$workspace" ]]; then
            echo "container=-workspace $workspace" >> "$GITHUB_OUTPUT"
            scheme="$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')"
          elif [[ -n "$project" ]]; then
            echo "container=-project $project" >> "$GITHUB_OUTPUT"
            scheme="$(xcodebuild -list -project "$project" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +| +$/, ""); print; exit}')"
          else
            echo "Missing Xcode workspace or project"
            exit 1
          fi

          if [[ -z "$scheme" ]]; then
            echo "Missing shared Xcode scheme"
            exit 1
          fi

          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild \
            ${{ steps.project.outputs.container }} \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            test
